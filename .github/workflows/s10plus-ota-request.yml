# Explicit Alpha 3.2 request for Galaxy S10+ SM-G975F / beyond2lte.
# Keep the S10 TWRP ZIP pipeline and separate RAW .img image structure.
# The pinned ExtremeROM repartitioner is referenced only for partition names; no sizes or physical-layout claim are adopted.
# The existing S10 TWRP RAW-image format is retained and is not attributed to ExtremeROM.
# The installer checks actual image bytes against current target capacities before writes but never repartitions or formats.
# The device's physical partition table and equivalence to ArtisanROM remain unverified.
# Build #4 stopped in the old OTA output verifier because scripts.collect_alpha was absent from its staged workspace;
# the validator import was repaired before switching this request to the historical S10 TWRP ZIP route.
# Tolerated patch failures remain recorded; compile/package failures are fatal; output remains UNTESTED.
# Editing this file on the session branch starts one Actions build; no public release is created.
name: Requested Galaxy S10+ SM-G975F X-NovaOS Alpha TWRP ROM ZIP build
run-name: "X-NovaOS Alpha 3.2 - Build #${{ github.run_number }} - Attempt #${{ github.run_attempt }} - SM-G975F / beyond2lte - TWRP ROM ZIP / EXTREME STRUCTURE / NO FIXED SIZE CAP / UNTESTED"
on:
  push:
    branches: [arena/0d47b1d6-artisanrom-beyoud]
    paths:
      - .github/workflows/s10plus-ota-request.yml
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/alpha.yml
    with:
      alpha_version: '3.2'
      output_format: twrp-zip
      target: beyond2lte
      diagnostic_only: false
      experimental_patch_failures: true
      partition_layout: extreme-structure
