# Full Alpha 3.2 request for Galaxy S10+ SM-G975F / beyond2lte.
# Match the successful normal-S10 Alpha 3.2 build settings, exact S24 FE donor, Artisan base and shared TWRP RAW-image pipeline.
# Use the Artisan beyond2lte target assets/kernel hook; do not copy OneROM patches explicitly scoped to beyond1lte.
# No fixed image-size caps or automatic partition/filesystem changes; TWRP checks actual image bytes against current capacities before writes.
# The physical partition table and ArtisanROM equivalence remain unverified; output is UNTESTED.
# Tolerated patch failures remain recorded; compile/package errors are fatal; no public release is created.
# Editing this request file on the session branch starts one full Actions build.
name: Requested Galaxy S10+ SM-G975F X-NovaOS Alpha TWRP ROM ZIP build
run-name: "X-NovaOS Alpha 3.2 - Build #${{ github.run_number }} - Attempt #${{ github.run_attempt }} - SM-G975F / beyond2lte - TWRP ROM ZIP / CONTENT-SIZED / NO FIXED SIZE CAP / UNTESTED"
on:
  push:
    branches: [arena/0d47b1d6-artisanrom-beyoud]
    paths:
      - .github/workflows/s10plus-ota-request.yml
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/alpha.yml
    with:
      alpha_version: '3.2'
      output_format: twrp-zip
      target: beyond2lte
      diagnostic_only: false
      experimental_patch_failures: true
      partition_layout: content-sized
