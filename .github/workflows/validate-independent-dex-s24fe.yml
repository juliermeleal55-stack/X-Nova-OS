name: Validate independent DEX probe on real S24 FE inputs
on:
  push:
    branches: [arena/0d47b1d6-artisanrom-beyoud]
    paths: [.github/workflows/validate-independent-dex-s24fe.yml]
permissions:
  contents: read
concurrency:
  group: independent-dex-s24fe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BEYOUD_JOBS: '1'
      CARGO_BUILD_JOBS: '1'
      BEYOUD_TARGET: beyond1lte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure workspace and patch author
        run: |
          echo "WORKSPACE=$RUNNER_TEMP/beyoud-workspace" >> "$GITHUB_ENV"
          git config --global user.name "Beyoud Alpha Builder"
          git config --global user.email "beyoud-build@users.noreply.github.com"
      - name: Validate integration
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_reference.py
          python3 scripts/verify_audit.py
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc brotli clang cmake zstd file attr golang-go openjdk-17-jdk lz4 libpcre2-dev pcre2-utils protobuf-compiler xxd p7zip-full rsync build-essential autoconf automake libtool pkg-config libssl-dev zlib1g-dev liblz4-dev libzstd-dev liblzma-dev libselinux1-dev libsepol-dev libpcre2-dev libunwind-dev libprotobuf-dev libusb-1.0-0-dev libgtest-dev libfmt-dev libbrotli-dev python3-venv python3-pip unzip zip curl wget git flex bison libncurses-dev libelf-dev ccache ninja-build uuid-dev libfuse-dev libfuse3-dev libdeflate-dev linux-libc-dev
          rustc --version
          cargo --version
          protoc --version
          clang --version
          df -h
      - name: Reclaim storage only on the disposable hosted runner
        if: runner.environment == 'github-hosted'
        env:
          BEYOUD_HOSTED_RUNNER: '1'
        run: |
          set -o pipefail
          bash scripts/prepare_hosted_storage.sh 2>&1 | tee "$RUNNER_TEMP/storage.log"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "/mnt/beyoud-$GITHUB_RUN_ID"
      - name: Select the filesystem with most available space
        run: python3 scripts/select_workspace_volume.py
      - name: Assemble Artisan S10 base with UN1CA donor
        run: |
          set -o pipefail
          python3 scripts/prepare_workspace.py "$WORKSPACE" --target "$BEYOUD_TARGET" --discard-archive 2>&1 | tee "$RUNNER_TEMP/prepare.log"
      - name: Initialize pinned build dependencies
        run: |
          set -o pipefail
          python3 scripts/init_workspace_dependencies.py "$WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/submodules.log"
      - name: Compile SmartDownload client pinned by UN1CA
        run: bash scripts/build_smart_downloader.sh "$WORKSPACE"
      - name: Verify source and target packages before compiling ROM tools
        run: bash scripts/probe_firmware.sh "$WORKSPACE"
      - name: Compile build tools
        run: bash scripts/build_candidate.sh "$WORKSPACE" dependencies
      - name: Download and extract donor firmware
        run: bash scripts/build_candidate.sh "$WORKSPACE" source
      - name: Preserve native and framework inputs for offline repair
        run: python3 scripts/capture_donor_repair_inputs.py "$WORKSPACE" "$RUNNER_TEMP/donor-repair-inputs"
      - name: Independently verify real S24 FE headers, decoded counts and descriptors
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          source ./buildenv.sh beyond1lte
          python3 "$GITHUB_WORKSPACE/scripts/validate_dex_probe_real.py" "$RUNNER_TEMP/donor-repair-inputs" "$RUNNER_TEMP/dex-probe-report"
      - name: Upload JSON evidence only, never firmware or decoded Smali
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S24FE-independent-dex-probe-evidence
          path: ${{ runner.temp }}/dex-probe-report/*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Annotate capture failure
        if: failure()
        run: python3 scripts/annotate_build_failure.py "$WORKSPACE"
      - name: Preserve capture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S24FE-independent-dex-probe-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ env.WORKSPACE }}/out/beyoud-logs/*.log
          retention-days: 7
          if-no-files-found: warn
