name: Compare upstream patch candidates on retained inputs
on:
  push:
    branches: [arena/0d47b1d6-artisanrom-beyoud]
    paths: [.github/workflows/replay-boot-patch-candidates.yml]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_audit.py
      - uses: actions/download-artifact@v4
        with:
          name: beyond1lte-alpha-build-diagnostics
          run-id: 42433286986
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-inputs
      - name: Verify scoped fixes and inspect paired DualAP methods on retained inputs
        run: python3 scripts/replay_upstream_candidates.py "$RUNNER_TEMP/retained-inputs" 42433286986
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-candidate-replay-report
          path: upstream-candidate-replay.json
          retention-days: 14
