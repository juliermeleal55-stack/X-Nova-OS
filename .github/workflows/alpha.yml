name: X-NovaOS Galaxy S10 Exynos experimental Alpha build
run-name: "X-NovaOS Alpha ${{ inputs.alpha_version }} - Build #${{ github.run_number }} - Attempt #${{ github.run_attempt }} - ${{ inputs.target }} - TWRP ROM ZIP - UNTESTED"
on:
  workflow_call:
    inputs:
      alpha_version:
        description: Public X-NovaOS Alpha version, numeric components such as 3.2
        type: string
        default: '3.2'
      diagnostic_only:
        description: Stop after patch preflight; do not build a ROM or TWRP ZIP
        type: boolean
        default: false
      partition_layout:
        description: Explicit partition profile, stock, extreme-default or content-sized for SM-G973F
        type: string
        default: stock
      experimental_patch_failures:
        description: Continue despite patch/module failures; boot NOT validated
        type: boolean
        default: false
      target:
        description: Explicit Exynos candidate codename
        type: string
        required: true
  workflow_dispatch:
    inputs:
      alpha_version:
        description: Public X-NovaOS Alpha version, numeric components such as 3.2
        type: string
        required: true
        default: '3.2'
      diagnostic_only:
        description: Stop after patch preflight; do not build a ROM or TWRP ZIP
        type: boolean
        default: false
      partition_layout:
        description: Explicit partition profile, stock, extreme-default or content-sized for SM-G973F
        type: string
        default: stock
      experimental_patch_failures:
        description: Continue despite patch/module failures; boot NOT validated
        type: boolean
        default: false
      target:
        description: Audited TWRP ROM ZIP target only (no boot validation)
        type: choice
        required: true
        default: beyond1lte
        options:
          - beyond1lte
permissions:
  contents: read
concurrency:
  group: s10-alpha-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BEYOUD_EXPERIMENTAL_ALLOW_PATCH_FAILURES: ${{ inputs.experimental_patch_failures && '1' || '0' }}
      BEYOUD_PARTITION_LAYOUT: ${{ inputs.partition_layout }}
      BEYOUD_OUTPUT_FORMAT: twrp-zip
      BEYOUD_ALPHA_VERSION: ${{ inputs.alpha_version }}
      BEYOUD_JOBS: '1'
      CARGO_BUILD_JOBS: '1'
      BEYOUD_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure workspace and patch author
        run: |
          echo "WORKSPACE=$RUNNER_TEMP/beyoud-workspace" >> "$GITHUB_ENV"
          git config --global user.name "Beyoud Alpha Builder"
          git config --global user.email "beyoud-build@users.noreply.github.com"
      - name: Record X-NovaOS build identity
        env:
          ALPHA_VERSION: ${{ inputs.alpha_version }}
        run: |
          if [[ ! "$ALPHA_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid public Alpha version: $ALPHA_VERSION" >&2
            exit 1
          fi
          {
            echo "## X-NovaOS Alpha $ALPHA_VERSION"
            echo
            echo "- Build number: #$GITHUB_RUN_NUMBER"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Target: $BEYOUD_TARGET"
            echo "- Output: one unsigned TWRP-installable ROM ZIP with expanded RAW .img payloads; no recovery image bundled or modified."
            echo "- The installer uses TWRP's update-binary interface; the ZIP and hardware remain untested."
            echo "- Status: experimental / untested; no release is published by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate integration
        env:
          BEYOUD_PARTITION_LAYOUT: stock
          BEYOUD_EXPERIMENTAL_ALLOW_PATCH_FAILURES: '0'
        run: |
          if ! python3 -m unittest discover -s tests -v > "$RUNNER_TEMP/integration-tests.log" 2>&1; then
            tail -80 "$RUNNER_TEMP/integration-tests.log"
            python3 scripts/annotate_test_failure.py "$RUNNER_TEMP/integration-tests.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/integration-tests.log"
          python3 scripts/verify_reference.py
          python3 scripts/verify_audit.py
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs bc brotli clang cmake zstd file attr golang-go openjdk-17-jdk lz4 libpcre2-dev pcre2-utils protobuf-compiler xxd p7zip-full rsync build-essential autoconf automake libtool pkg-config libssl-dev zlib1g-dev liblz4-dev libzstd-dev liblzma-dev libselinux1-dev libsepol-dev libpcre2-dev libunwind-dev libprotobuf-dev libusb-1.0-0-dev libgtest-dev libfmt-dev libbrotli-dev python3-venv python3-pip unzip zip curl wget git flex bison libncurses-dev libelf-dev ccache ninja-build uuid-dev libfuse-dev libfuse3-dev libdeflate-dev linux-libc-dev
          rustc --version
          cargo --version
          protoc --version
          clang --version
          df -h
      - name: Reclaim storage only on the disposable hosted runner
        if: runner.environment == 'github-hosted'
        env:
          BEYOUD_HOSTED_RUNNER: '1'
        run: |
          set -o pipefail
          bash scripts/prepare_hosted_storage.sh 2>&1 | tee "$RUNNER_TEMP/storage.log"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "/mnt/beyoud-$GITHUB_RUN_ID"
      - name: Select the filesystem with most available space
        run: python3 scripts/select_workspace_volume.py
      - name: Assemble Artisan S10 base with configured donor
        run: |
          set -o pipefail
          python3 scripts/prepare_workspace.py "$WORKSPACE" --target "$BEYOUD_TARGET" --discard-archive 2>&1 | tee "$RUNNER_TEMP/prepare.log"
      - name: Initialize pinned build dependencies
        run: |
          set -o pipefail
          python3 scripts/init_workspace_dependencies.py "$WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/submodules.log"
      - name: Compile SmartDownload client pinned by UN1CA
        run: bash scripts/build_smart_downloader.sh "$WORKSPACE"
      - name: Verify source and target packages before compiling ROM tools
        run: bash scripts/probe_firmware.sh "$WORKSPACE"
      - name: Compile build tools
        run: bash scripts/build_candidate.sh "$WORKSPACE" dependencies
      - name: Verify actual Smali assembly before downloading firmware
        run: python3 scripts/smoke_smali.py "$WORKSPACE"
      - name: Download and extract donor firmware
        run: bash scripts/build_candidate.sh "$WORKSPACE" source
      - name: Download and extract selected S10 stock firmware
        run: bash scripts/build_candidate.sh "$WORKSPACE" target
      - name: Verify package identifiers and stock image limits before patch compilation
        run: python3 "$WORKSPACE/integration/package_inputs.py" verify "$WORKSPACE"
      - name: Diagnose modules and patches only, without producing a ROM
        if: inputs.diagnostic_only
        run: bash scripts/build_candidate.sh "$WORKSPACE" diagnostic
      - name: Preflight modules and apply patches using pinned OneROM boot images
        if: ${{ !inputs.diagnostic_only }}
        run: bash scripts/build_candidate.sh "$WORKSPACE" patch
      - name: Capture package inputs and retire verified firmware trees
        if: ${{ !inputs.diagnostic_only }}
        run: bash scripts/build_candidate.sh "$WORKSPACE" retire
      - name: Build and verify the TWRP-installable ROM ZIP from RAW partition images
        if: ${{ !inputs.diagnostic_only }}
        run: bash scripts/build_candidate.sh "$WORKSPACE" package
      - name: Validate TWRP ZIP; reject OTA payloads and recovery images
        if: ${{ !inputs.diagnostic_only }}
        id: twrp_package
        run: |
          python3 scripts/validate_twrp_zip.py "$WORKSPACE"
          echo "path=$WORKSPACE/out/twrp-zips/$BEYOUD_TARGET/*.zip" >> "$GITHUB_OUTPUT"
      - name: Upload only the TWRP-installable ROM ZIP
        if: ${{ !inputs.diagnostic_only }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: X-NovaOS-${{ inputs.target }}-Alpha-${{ inputs.alpha_version }}-Build-${{ github.run_number }}-Attempt-${{ github.run_attempt }}-TWRP-ROM-ZIP-UNTESTED
          path: ${{ steps.twrp_package.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Summarize patch diagnosis even if a prerequisite failed
        if: ${{ always() && inputs.diagnostic_only }}
        run: python3 scripts/summarize_patch_diagnostic.py "$WORKSPACE"
      - name: Annotate build failure tail
        if: failure()
        run: python3 scripts/annotate_build_failure.py "$WORKSPACE"
      - name: Preserve diagnostics even when build fails
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.target }}-alpha-build-diagnostics
          path: |
            ${{ runner.temp }}/storage.log
            ${{ runner.temp }}/prepare.log
            ${{ runner.temp }}/submodules.log
            ${{ env.WORKSPACE }}/BEYOUD-WORKSPACE.json
            ${{ env.WORKSPACE }}/out/firmware-lock.json
            ${{ env.WORKSPACE }}/out/config.sh
            ${{ env.WORKSPACE }}/out/beyoud-logs/*.log
            ${{ env.WORKSPACE }}/out/beyoud-logs/*.json*
            ${{ env.WORKSPACE }}/out/beyoud-logs/dex-inventory/*.json
            ${{ env.WORKSPACE }}/out/beyoud-logs/failed-smali/**/*.smali
            ${{ env.WORKSPACE }}/out/beyoud-logs/patch-preflight-smali/**/*.smali
            ${{ env.WORKSPACE }}/out/beyoud-logs/native-inputs/*
            ${{ env.WORKSPACE }}/out/beyoud-logs/patch-preflight-modules/**/*.log
            ${{ env.WORKSPACE }}/out/beyoud-stages/*.json
            ${{ env.WORKSPACE }}/out/beyoud-package-inputs.json
            ${{ env.WORKSPACE }}/out/beyoud-fw-retired.json
            ${{ env.WORKSPACE }}/out/beyoud-firmware-inspection.json
          if-no-files-found: warn
          retention-days: 7
