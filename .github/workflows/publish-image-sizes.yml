name: Publish existing alpha image sizes
on:
  workflow_dispatch:
  push:
    branches: [arena/0d47b1d6-artisanrom-beyoud]
    paths:
      - .github/workflows/publish-image-sizes.yml
      - scripts/publish_image_sizes.py
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract original size report without rebuilding the ROM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_image_sizes.py
      - name: Attach original JSON to the existing test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.1.0-alpha1-sm-g973f-test REQUIRED-IMAGE-SIZES.json --clobber
