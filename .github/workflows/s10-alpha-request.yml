# Explicit build request for SM-G973F, authorized by the repository owner.
# Only editing this request file on the session branch starts another attempt.
name: Requested S10 SM-G973F Alpha 3 Artisan installer
on:
  push:
    branches: [arena/0d47b1d6-artisanrom-beyoud]
    paths: [.github/workflows/s10-alpha-request.yml]
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/alpha.yml
    with:
      target: beyond1lte
      diagnostic_only: false
      experimental_patch_failures: true
      partition_layout: content-sized

  publish:
    name: Publish validated Alpha 3 as an Actions-linked prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish complete package link without editing or splitting the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_alpha3.py

